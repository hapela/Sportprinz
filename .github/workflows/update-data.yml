name: Trainierende-Daten aktualisieren

on:
  schedule:
    # Jede Stunde zur Minute 7, UTC
    - cron: "2/10 * * * *"

  # Ermöglicht einen manuellen Start über GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daten-aktualisieren:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: API abfragen und Daten speichern
        run: |
          python fetch_data.py

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
          else
            git commit -m "Messwerte aktualisiert"
            git push
          fi
